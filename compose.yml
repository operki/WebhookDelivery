services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: webhooks
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=webhooks;Username=webhooks;Password=local-development-only
      Delivery__DestinationUrl: http://receiver:8080/webhooks
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  receiver:
    build:
      context: .
      dockerfile: SampleReceiver/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  postgres-data:
